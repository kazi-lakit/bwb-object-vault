server {
  listen 8080;
  root /usr/share/nginx/html/;
  server_tokens off;
  client_max_body_size 200m;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain application/x-javascript text/xml text/css application/xml text/javascript application/javascript application/json application/font-woff application/font-woff2 application/vnd.ms-fontobject application/x-font-ttf font/opentype;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The SPA shell references hashed asset filenames, so it must always be
  # revalidated -- otherwise a browser can keep serving a stale index.html
  # (pointing at an old JS bundle) indefinitely after a redeploy, with no
  # visible sign anything is wrong.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Asset filenames change on every build (content-hashed), so it's safe --
  # and expected -- to cache these as long as possible.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
